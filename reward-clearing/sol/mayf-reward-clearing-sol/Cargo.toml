[package]
name = "mayf-reward-clearing-sol"
version = "0.1.0"
description = "Mayflower reward clearing Solana program"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "mayf_reward_clearing_sol"
doctest = false

[features]
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = ["no-log-ix-name"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
mayf-reward-clearing = { workspace = true }
mayf-fixed-drivers = { workspace = true }
mayf-fixed-number = { workspace = true }
mayf-micro-basis-points = { workspace = true }
mayf-sol-log-sink-cpi = { workspace = true }
