name: CI

on:
  pull_request:
    branches: [master]
  # Runs on master save a build cache that every pull request can restore.
  # GitHub only lets a pull request read caches from its own branch and its
  # base branch, so without these runs each new pull request starts cold.
  push:
    branches: [master]

# A new push to a pull request cancels its older run. Master runs are never
# cancelled, so each merge finishes and saves its cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup is preinstalled on the runner. With no argument it installs the
      # toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      # The cache key includes the rustc version, so this runs after the
      # toolchain install.
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked
