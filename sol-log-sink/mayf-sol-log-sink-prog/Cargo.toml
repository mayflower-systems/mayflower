[package]
name = "mayf-sol-log-sink-prog"
version = "1.0.0"
description = "Solana log sink for CPI instruction data"
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
name = "mayf_sol_log_sink_prog"

[dependencies]
mayf-sol-log-sink-id.workspace = true
# Stack-height check and error logging.
solana-define-syscall.workspace = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
