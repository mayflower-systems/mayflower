<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">One budget. Many AVAs.</title><desc id="desc">Pledged credits allocate one global emission budget across AVA lanes. Illustrative alternatives divide the same one hundred credit budget between two AVAs at sixty and forty, or three AVAs at fifty, thirty and twenty. Adding a lane does not create extra emission. Pledges must be released before the same credits can be bid in clearing.</desc><defs><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087761"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A5630E"/></marker><marker id="muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536963"/></marker><marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#18352F"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42758B"/></marker></defs><g font-family="Liberation Sans, Arial, sans-serif"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#F7F6F0"/><text x="64" y="62" font-size="19" fill="#18352F" font-weight="700" text-anchor="start">MAYFLOWER</text><text x="1016" y="62" font-size="18" fill="#536963" font-weight="400" text-anchor="end">02 / DIRECT</text><text x="64" y="134" font-size="48" fill="#18352F" font-weight="700" text-anchor="start">One budget. Many AVAs.</text><text x="64" y="181" font-size="26" fill="#536963" font-weight="400" text-anchor="start">Pledged credits direct each AVA’s share of future emission.</text><rect x="64" y="230" width="952" height="123" rx="20" fill="#F4E8CF"/><text x="92" y="273" font-size="19" fill="#A5630E" font-weight="700" text-anchor="start">GLOBAL CREDIT BUDGET</text><text x="92" y="325" font-size="44" fill="#18352F" font-weight="700" text-anchor="start">100 credits</text><text x="360" y="323" font-size="25" fill="#536963" font-weight="400" text-anchor="start">Two illustrative ways to divide the same budget</text><text x="64" y="409" font-size="29" fill="#18352F" font-weight="700" text-anchor="start">Two AVAs</text><rect x="64" y="436" width="567.2" height="90" rx="6" fill="#087761"/><text x="349.6" y="475" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">AVA A</text><text x="349.6" y="509" font-size="27" fill="#FFFFFF" font-weight="400" text-anchor="middle">60 credits</text><rect x="635.2" y="436" width="376.8" height="90" rx="6" fill="#42758B"/><text x="825.6" y="475" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">AVA B</text><text x="825.6" y="509" font-size="27" fill="#FFFFFF" font-weight="400" text-anchor="middle">40 credits</text><text x="64" y="562" font-size="22" fill="#536963" font-weight="400" text-anchor="start">Pledged-credit weights: 60 / 40</text><text x="1016" y="562" font-size="24" fill="#18352F" font-weight="700" text-anchor="end">Total: 100</text><text x="64" y="641" font-size="29" fill="#18352F" font-weight="700" text-anchor="start">Three AVAs</text><rect x="64" y="668" width="472.0" height="90" rx="6" fill="#087761"/><text x="302.0" y="707" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">AVA A</text><text x="302.0" y="741" font-size="27" fill="#FFFFFF" font-weight="400" text-anchor="middle">50 credits</text><rect x="540.0" y="668" width="281.6" height="90" rx="6" fill="#42758B"/><text x="682.8" y="707" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">AVA B</text><text x="682.8" y="741" font-size="27" fill="#FFFFFF" font-weight="400" text-anchor="middle">30 credits</text><rect x="825.6" y="668" width="186.4" height="90" rx="6" fill="#A5630E"/><text x="920.8000000000001" y="707" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle">AVA C</text><text x="920.8000000000001" y="741" font-size="27" fill="#FFFFFF" font-weight="400" text-anchor="middle">20 credits</text><text x="64" y="794" font-size="22" fill="#536963" font-weight="400" text-anchor="start">Pledged-credit weights: 50 / 30 / 20</text><text x="1016" y="794" font-size="24" fill="#18352F" font-weight="700" text-anchor="end">Total: 100</text><text x="64" y="849" font-size="25" fill="#536963" font-weight="400" text-anchor="start">The new AVA receives a share when it attracts credit pledges.</text><rect x="64" y="904" width="952" height="112" rx="18" fill="#18352F"/><text x="92" y="950" font-size="27" fill="#F7F6F0" font-weight="400" text-anchor="start">Adding AVAs divides the scheduled budget among more lanes.</text><text x="92" y="987" font-size="27" fill="#F7F6F0" font-weight="400" text-anchor="start">Pledges direct allocation; they do not increase total emission.</text><text x="64" y="1053" font-size="16" fill="#536963" font-weight="400" text-anchor="start">MAYFLOWER  /  Intended system composition</text></g></svg>