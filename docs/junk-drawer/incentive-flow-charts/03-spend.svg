<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">Many assets. One bidding unit.</title><desc id="desc">AVM protocol fees fund separate reward clearing pots in their original reserve assets. Credits provide a common bidding unit across the pots. Bidders choose which assets to pursue and how much to commit. Each pot pays in its original asset, in proportion to surviving time-weighted shares. Credits remaining committed at finalization burn. The protocol need not convert the pots into a common token or assign them a common dollar price.</desc><defs><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087761"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A5630E"/></marker><marker id="muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536963"/></marker><marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#18352F"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42758B"/></marker></defs><g font-family="Liberation Sans, Arial, sans-serif"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#F7F6F0"/><text x="64" y="62" font-size="19" fill="#18352F" font-weight="700" text-anchor="start">MAYFLOWER</text><text x="1016" y="62" font-size="18" fill="#536963" font-weight="400" text-anchor="end">03 / SPEND</text><text x="64" y="134" font-size="48" fill="#18352F" font-weight="700" text-anchor="start">Many assets. One bidding unit.</text><text x="64" y="181" font-size="26" fill="#536963" font-weight="400" text-anchor="start">Credits connect participation to heterogeneous reward pots.</text><text x="540" y="262" font-size="28" fill="#087761" font-weight="700" text-anchor="middle">AVM protocol fees arrive in their original reserve assets</text><path d="M 214 290 L 214 337" fill="none" stroke="#087761" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/><rect x="64" y="337" width="300" height="247" rx="20" fill="#FFFFFF" stroke="#D4DDD5" stroke-width="1.5"/><text x="214" y="380" font-size="17" fill="#536963" font-weight="700" text-anchor="middle">REWARD CLEARING</text><circle cx="214" cy="429" r="28" fill="#087761"/><text x="214" y="439" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><text x="214" y="498" font-size="30" fill="#18352F" font-weight="700" text-anchor="middle">Reserve A pot</text><text x="214" y="542" font-size="23" fill="#536963" font-weight="400" text-anchor="middle">Pays bidders in A</text><path d="M 540 290 L 540 337" fill="none" stroke="#087761" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/><rect x="390" y="337" width="300" height="247" rx="20" fill="#FFFFFF" stroke="#D4DDD5" stroke-width="1.5"/><text x="540" y="380" font-size="17" fill="#536963" font-weight="700" text-anchor="middle">REWARD CLEARING</text><circle cx="540" cy="429" r="28" fill="#42758B"/><text x="540" y="439" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">B</text><text x="540" y="498" font-size="30" fill="#18352F" font-weight="700" text-anchor="middle">Reserve B pot</text><text x="540" y="542" font-size="23" fill="#536963" font-weight="400" text-anchor="middle">Pays bidders in B</text><path d="M 866 290 L 866 337" fill="none" stroke="#087761" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/><rect x="716" y="337" width="300" height="247" rx="20" fill="#FFFFFF" stroke="#D4DDD5" stroke-width="1.5"/><text x="866" y="380" font-size="17" fill="#536963" font-weight="700" text-anchor="middle">REWARD CLEARING</text><circle cx="866" cy="429" r="28" fill="#A5630E"/><text x="866" y="439" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">C</text><text x="866" y="498" font-size="30" fill="#18352F" font-weight="700" text-anchor="middle">Reserve C pot</text><text x="866" y="542" font-size="23" fill="#536963" font-weight="400" text-anchor="middle">Pays bidders in C</text><path d="M 540 738 L 540 723" fill="none" stroke="#A5630E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 540 677 L 540 649" fill="none" stroke="#A5630E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 540 649 L 214 649 L 214 584" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><path d="M 540 649 L 540 584" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><path d="M 540 649 L 866 649 L 866 584" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><text x="540" y="705" font-size="25" fill="#A5630E" font-weight="700" text-anchor="middle">Choose pots · commit credits · receive weighted shares</text><rect x="328" y="738" width="424" height="120" rx="20" fill="#F4E8CF"/><text x="540" y="786" font-size="38" fill="#18352F" font-weight="700" text-anchor="middle">Credits · $M</text><text x="540" y="829" font-size="27" fill="#536963" font-weight="400" text-anchor="middle">A common bidding unit</text><rect x="64" y="904" width="952" height="112" rx="18" fill="#18352F"/><text x="92" y="950" font-size="27" fill="#F7F6F0" font-weight="400" text-anchor="start">Bidders decide what each asset is worth to them.</text><text x="92" y="987" font-size="27" fill="#F7F6F0" font-weight="400" text-anchor="start">Credits still committed at finalization are burned.</text><text x="64" y="1053" font-size="16" fill="#536963" font-weight="400" text-anchor="start">MAYFLOWER  /  Intended system composition</text></g></svg>