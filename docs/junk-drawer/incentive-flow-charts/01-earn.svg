<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">Rewards follow real holdings.</title><desc id="desc">Illustrative core allocation: a member with ten percent of eligible holdings in one AVA lane is attributed one hundred of its one thousand scheduled credits. With two earning ancestors and a ten percent commission per ancestor, the holder retains eighty credits and each ancestor receives ten. Referrals divide the existing attribution. Optional family sharing is omitted.</desc><defs><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087761"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A5630E"/></marker><marker id="muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536963"/></marker><marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#18352F"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42758B"/></marker></defs><g font-family="Liberation Sans, Arial, sans-serif"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#F7F6F0"/><text x="64" y="62" font-size="19" fill="#18352F" font-weight="700" text-anchor="start">MAYFLOWER</text><text x="1016" y="62" font-size="18" fill="#536963" font-weight="400" text-anchor="end">01 / EARN</text><text x="64" y="134" font-size="48" fill="#18352F" font-weight="700" text-anchor="start">Rewards follow real holdings.</text><text x="64" y="181" font-size="26" fill="#536963" font-weight="400" text-anchor="start">Eligible AVA balances determine the core allocation.</text><rect x="64" y="230" width="952" height="137" rx="20" fill="#F4E8CF"/><text x="92" y="276" font-size="19" fill="#A5630E" font-weight="700" text-anchor="start">AVA A’S EMISSION LANE</text><text x="92" y="331" font-size="45" fill="#18352F" font-weight="700" text-anchor="start">1,000 credits</text><text x="405" y="329" font-size="26" fill="#536963" font-weight="400" text-anchor="start">scheduled for this illustrative interval</text><path d="M 540 367 L 540 418" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><rect x="224" y="418" width="632" height="147" rx="18" fill="#FFFFFF" stroke="#D4DDD5" stroke-width="1.5"/><text x="540" y="464" font-size="28" fill="#18352F" font-weight="700" text-anchor="middle">Your eligible AVA A holdings</text><text x="540" y="507" font-size="27" fill="#536963" font-weight="400" text-anchor="middle">10% of this lane’s eligible balance</text><text x="540" y="545" font-size="28" fill="#A5630E" font-weight="700" text-anchor="middle">→ 100 credits attributed to your position</text><path d="M 540 565 L 540 602" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 540 602 L 214 602 L 214 640" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><rect x="64" y="640" width="300" height="210" rx="18" fill="#E6F0E9"/><text x="90" y="706" font-size="48" fill="#087761" font-weight="700" text-anchor="start">80</text><text x="90" y="759" font-size="26" fill="#18352F" font-weight="700" text-anchor="start">You</text><text x="90" y="805" font-size="22" fill="#536963" font-weight="400" text-anchor="start">Retained credits</text><path d="M 540 602 L 540 602 L 540 640" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><rect x="390" y="640" width="300" height="210" rx="18" fill="#E7EFF2"/><text x="416" y="706" font-size="48" fill="#42758B" font-weight="700" text-anchor="start">10</text><text x="416" y="759" font-size="26" fill="#18352F" font-weight="700" text-anchor="start">Your parent</text><text x="416" y="805" font-size="22" fill="#536963" font-weight="400" text-anchor="start">Referral credits</text><path d="M 540 602 L 866 602 L 866 640" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><rect x="716" y="640" width="300" height="210" rx="18" fill="#F4E8CF"/><text x="742" y="706" font-size="48" fill="#A5630E" font-weight="700" text-anchor="start">10</text><text x="742" y="759" font-size="26" fill="#18352F" font-weight="700" text-anchor="start">Your grandparent</text><text x="742" y="805" font-size="22" fill="#536963" font-weight="400" text-anchor="start">Referral credits</text><rect x="64" y="904" width="952" height="112" rx="18" fill="#18352F"/><text x="92" y="950" font-size="27" fill="#F7F6F0" font-weight="400" text-anchor="start">The holder and referrers share the same 100 credits.</text><text x="92" y="987" font-size="27" fill="#F7F6F0" font-weight="400" text-anchor="start">The eligible AVA principal is not spent on commissions.</text><text x="64" y="1053" font-size="16" fill="#536963" font-weight="400" text-anchor="start">MAYFLOWER  /  Intended system composition</text><text x="64" y="882" font-size="18" fill="#536963" font-weight="400" text-anchor="start">Example: two earning ancestors, 10% each; optional family sharing omitted.</text></g></svg>