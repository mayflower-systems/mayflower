<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Many markets. One incentive system.</title><desc id="desc">AVM protocol fees fund separate reserve-asset reward pots. Bidders commit credits, receive proportional asset rewards, and remaining credit bids burn at finalization. A declining scheduled global credit budget is divided by AVA weights and allocated through eligible holdings and referral ancestry. Collected credits may be spent in clearing or pledged to direct future AVA allocations. Pledged credits must be released before bidding.</desc><defs><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087761"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A5630E"/></marker><marker id="muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536963"/></marker><marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#18352F"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42758B"/></marker></defs><g font-family="Liberation Sans, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F7F6F0"/><text x="64" y="62" font-size="19" fill="#18352F" font-weight="700" text-anchor="start">MAYFLOWER</text><text x="1536" y="62" font-size="18" fill="#536963" font-weight="400" text-anchor="end">THE WHOLE SYSTEM</text><text x="64" y="134" font-size="48" fill="#18352F" font-weight="700" text-anchor="start">Many markets. One incentive system.</text><text x="64" y="181" font-size="26" fill="#536963" font-weight="400" text-anchor="start">Participation earns credits. Activity funds rewards.</text><text x="64" y="238" font-size="20" fill="#087761" font-weight="700" text-anchor="start">WHERE THE REWARD ASSETS COME FROM</text><path d="M 374 359 L 665 359" fill="none" stroke="#087761" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/><text x="519" y="326" font-size="25" fill="#087761" font-weight="700" text-anchor="middle">Protocol fees</text><text x="519" y="398" font-size="22" fill="#536963" font-weight="400" text-anchor="middle">Original reserve asset</text><text x="519" y="427" font-size="22" fill="#536963" font-weight="400" text-anchor="middle">Same transaction</text><path d="M 1125 359 L 1320 359" fill="none" stroke="#087761" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/><text x="1222" y="310" font-size="23" fill="#087761" font-weight="400" text-anchor="middle">Proportional</text><text x="1222" y="340" font-size="23" fill="#087761" font-weight="400" text-anchor="middle">pot shares</text><path d="M 219 505 L 219 585 L 959 585 L 959 670" fill="none" stroke="#536963" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#muted)" stroke-dasharray="7 8"/><text x="568" y="566" font-size="26" fill="#536963" font-weight="400" text-anchor="middle">Eligible AVA holdings</text><path d="M 1385 670 L 1385 550 L 1045 550 L 1045 505" fill="none" stroke="#A5630E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><text x="1215" y="531" font-size="25" fill="#A5630E" font-weight="700" text-anchor="middle">SPEND · bid credits</text><path d="M 1385 860 L 1385 935 L 554 935 L 554 860" fill="none" stroke="#A5630E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><text x="974" y="911" font-size="26" fill="#A5630E" font-weight="700" text-anchor="middle">PLEDGE · direct future emission</text><text x="974" y="980" font-size="23" fill="#536963" font-weight="400" text-anchor="middle">Release pledged credits before using them to bid.</text><rect x="64" y="265" width="310" height="240" rx="20" fill="#E6F0E9"/><text x="90" y="314" font-size="35" fill="#18352F" font-weight="700" text-anchor="start">AVM Core</text><text x="90" y="359" font-size="24" fill="#536963" font-weight="400" text-anchor="start">Reserve-backed AVAs</text><text x="90" y="393" font-size="24" fill="#536963" font-weight="400" text-anchor="start">Buy · sell · borrow</text><path d="M 90 414 L 348 414" fill="none" stroke="#536963" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="454" font-size="27" fill="#18352F" font-weight="700" text-anchor="start">AVA positions</text><text x="90" y="483" font-size="20" fill="#536963" font-weight="400" text-anchor="start">Eligible AVA balances</text><rect x="665" y="265" width="460" height="240" rx="20" fill="#E6F0E9"/><text x="693" y="312" font-size="35" fill="#18352F" font-weight="700" text-anchor="start">Reward clearing</text><text x="693" y="345" font-size="22" fill="#536963" font-weight="400" text-anchor="start">Separate pots for each reserve asset</text><rect x="693" y="365" width="120" height="46" rx="10" fill="#FFFFFF"/><text x="753" y="396" font-size="23" fill="#18352F" font-weight="400" text-anchor="middle">Asset A</text><rect x="829" y="365" width="120" height="46" rx="10" fill="#FFFFFF"/><text x="889" y="396" font-size="23" fill="#18352F" font-weight="400" text-anchor="middle">Asset B</text><rect x="965" y="365" width="120" height="46" rx="10" fill="#FFFFFF"/><text x="1025" y="396" font-size="23" fill="#18352F" font-weight="400" text-anchor="middle">Asset C</text><rect x="681" y="429" width="428" height="60" rx="10" fill="#F4E8CF"/><text x="895" y="454" font-size="22" fill="#A5630E" font-weight="700" text-anchor="middle">Remaining credit bids burn</text><text x="895" y="479" font-size="22" fill="#A5630E" font-weight="700" text-anchor="middle">when the auction is finalized.</text><rect x="1320" y="265" width="216" height="240" rx="20" fill="#E6F0E9"/><text x="1345" y="314" font-size="30" fill="#18352F" font-weight="700" text-anchor="start">Bidders</text><text x="1345" y="353" font-size="30" fill="#18352F" font-weight="700" text-anchor="start">receive</text><text x="1345" y="392" font-size="30" fill="#18352F" font-weight="700" text-anchor="start">assets</text><text x="1345" y="449" font-size="20" fill="#536963" font-weight="400" text-anchor="start">Original tokens,</text><text x="1345" y="477" font-size="20" fill="#536963" font-weight="400" text-anchor="start">by auction shares.</text><text x="64" y="639" font-size="20" fill="#A5630E" font-weight="700" text-anchor="start">HOW PARTICIPATION EARNS BIDDING POWER</text><path d="M 324 753 L 414 753" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><path d="M 694 753 L 784 753" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><path d="M 1134 753 L 1234 753" fill="none" stroke="#A5630E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)"/><text x="369" y="728" font-size="21" fill="#A5630E" font-weight="400" text-anchor="middle">budget</text><text x="739" y="728" font-size="21" fill="#A5630E" font-weight="400" text-anchor="middle">allocate</text><text x="1184" y="728" font-size="21" fill="#A5630E" font-weight="400" text-anchor="middle">collect</text><rect x="64" y="670" width="260" height="190" rx="20" fill="#F4E8CF"/><text x="88" y="714" font-size="31" fill="#18352F" font-weight="700" text-anchor="start">Global credit</text><text x="88" y="751" font-size="31" fill="#18352F" font-weight="700" text-anchor="start">emission</text><text x="88" y="795" font-size="20" fill="#536963" font-weight="400" text-anchor="start">One scheduled budget</text><text x="88" y="824" font-size="20" fill="#536963" font-weight="400" text-anchor="start">Declining rate over time</text><rect x="414" y="670" width="280" height="190" rx="20" fill="#FFFFFF" stroke="#D4DDD5" stroke-width="1.5"/><text x="438" y="718" font-size="32" fill="#18352F" font-weight="700" text-anchor="start">AVA weights</text><text x="438" y="756" font-size="24" fill="#536963" font-weight="400" text-anchor="start">By pledged credits</text><rect x="438" y="784" width="104" height="17" rx="3" fill="#087761"/><text x="490.0" y="832" font-size="21" fill="#536963" font-weight="400" text-anchor="middle">A</text><rect x="545" y="784" width="62" height="17" rx="3" fill="#42758B"/><text x="576.0" y="832" font-size="21" fill="#536963" font-weight="400" text-anchor="middle">B</text><rect x="610" y="784" width="60" height="17" rx="3" fill="#A5630E"/><text x="640.0" y="832" font-size="21" fill="#536963" font-weight="400" text-anchor="middle">C</text><rect x="784" y="670" width="350" height="190" rx="20" fill="#FFFFFF" stroke="#D4DDD5" stroke-width="1.5"/><text x="810" y="718" font-size="32" fill="#18352F" font-weight="700" text-anchor="start">Referral network</text><text x="810" y="762" font-size="24" fill="#536963" font-weight="400" text-anchor="start">Holdings set each share.</text><text x="810" y="795" font-size="24" fill="#536963" font-weight="400" text-anchor="start">Holders + referrers earn.</text><text x="810" y="836" font-size="20" fill="#536963" font-weight="400" text-anchor="start">Within each AVA lane</text><rect x="1234" y="670" width="302" height="190" rx="20" fill="#F4E8CF"/><text x="1260" y="721" font-size="37" fill="#18352F" font-weight="700" text-anchor="start">Credits · $M</text><text x="1260" y="767" font-size="24" fill="#536963" font-weight="400" text-anchor="start">Issued on collection</text><text x="1260" y="822" font-size="27" fill="#A5630E" font-weight="700" text-anchor="start">Spend or pledge</text><rect x="64" y="1013" width="1472" height="58" rx="12" fill="#18352F"/><text x="800" y="1051" font-size="29" fill="#F7F6F0" font-weight="400" text-anchor="middle">Growth shares the emission budget. Useful activity can grow the reward pots.</text><text x="64" y="1101" font-size="18" fill="#536963" font-weight="400" text-anchor="start">Intended composition · One global schedule per protocol instance · Core incentive paths</text><text x="1536" y="1101" font-size="18" fill="#536963" font-weight="400" text-anchor="end">Dashed line = eligibility input</text></g></svg>