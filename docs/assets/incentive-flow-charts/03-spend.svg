    <path d="M 540 677 L 540 649" fill="none" stroke="var(--pink-500)" stroke-width="4" />
    <path d="M 540 649 L 214 649 L 214 584" fill="none" stroke="var(--pink-500)" stroke-width="3.5" marker-end="url(#spend-credits-arrow)" />
    <path d="M 540 649 L 540 584" fill="none" stroke="var(--pink-500)" stroke-width="3.5" marker-end="url(#spend-credits-arrow)" />
    <path d="M 540 649 L 866 649 L 866 584" fill="none" stroke="var(--pink-500)" stroke-width="3.5" marker-end="url(#spend-credits-arrow)" />
    <text x="540" y="705" font-size="25" fill="var(--pink-600)" font-weight="700" text-anchor="middle">Choose pots · commit credits · receive weighted shares</text>
    <rect x="328" y="738" width="424" height="120" fill="var(--pink-100)" />
    <text x="540" y="786" font-size="38" fill="var(--navy-900)" font-weight="600" text-anchor="middle" font-family="var(--font-serif)" letter-spacing="var(--tracking-tight)">Credits · $M</text>
    <text x="540" y="829" font-size="27" fill="var(--navy-500)" font-weight="400" text-anchor="middle">A common bidding unit</text>
    <rect x="64" y="904" width="952" height="112" fill="var(--navy-800)" />
    <text x="92" y="950" font-size="27" fill="var(--paper)" font-weight="400" text-anchor="start">Bidders decide what each asset is worth to them.</text>
    <text x="92" y="987" font-size="27" fill="var(--paper)" font-weight="400" text-anchor="start">Credits still committed at finalization are burned.</text>
    <text x="64" y="1053" font-size="16" fill="var(--navy-400)" font-weight="400" text-anchor="start">MAYFLOWER  /  Intended system composition</text>
  </g>
