<?xml-stylesheet type="text/css" href="../../../browser/theme/src/tokens.css"?>
<?xml-stylesheet type="text/css" href="../../../browser/theme/src/fraunces.css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="spend-title spend-desc">
  <title id="spend-title">Many assets. One bidding unit.</title>
  <desc id="spend-desc">AVM protocol fees fund separate reward clearing pots in their original reserve assets. Credits provide a common bidding unit across the pots. Bidders choose which assets to pursue and how much to commit. Each pot pays in its original asset, in proportion to surviving time-weighted shares. Credits remaining committed at finalization burn. The protocol need not convert the pots into a common token or assign them a common dollar price.</desc>
  <defs>
    <marker id="spend-reserve-arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--navy-800)" />
    </marker>
    <marker id="spend-credits-arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--pink-500)" />
    </marker>
  </defs>
  <g font-family="var(--font-sans)">
    <rect x="0" y="0" width="1080" height="1080" fill="var(--paper)" />
    <!-- Mayflower press kit lockup. -->
    <g transform="translate(64 33)" role="img" aria-label="Mayflower" fill="var(--navy-900)">
      <path d="M39.9028 19.9514C39.9028 30.9703 30.9703 39.9028 19.9514 39.9028C8.93255 39.9028 0 30.9703 0 19.9514C0 8.93255 8.93255 0 19.9514 0C30.9703 0 39.9028 8.93255 39.9028 19.9514Z" />
      <g fill="var(--pink-200)" fill-rule="evenodd">
        <path d="M29.3904 30.7852L21.3156 24.0517C20.5079 23.3781 19.3343 23.3781 18.5266 24.0517L10.4518 30.7852L7.94043 27.7736L16.0152 21.0401C18.2775 19.1536 21.5647 19.1536 23.827 21.0401L31.9018 27.7736L29.3904 30.7852Z" />
        <path d="M19.9211 12.7232L29.3904 20.6196L31.9018 17.608L19.9211 7.61734L7.94043 17.608L10.4518 20.6196L19.9211 12.7232Z" />
      </g>
      <text x="52" y="27" font-family="var(--font-serif)" font-weight="700" font-size="22" letter-spacing="1.2">MAYFLOWER</text>
    </g>
    <text x="1016" y="62" font-size="18" fill="var(--navy-400)" font-weight="400" text-anchor="end" letter-spacing="var(--tracking-wider)">03 / SPEND</text>
    <text x="64" y="134" font-size="48" fill="var(--navy-900)" font-weight="600" text-anchor="start" font-family="var(--font-serif)" letter-spacing="var(--tracking-tight)">Many assets. One bidding unit.</text>
    <text x="64" y="181" font-size="26" fill="var(--navy-400)" font-weight="400" text-anchor="start">Credits connect participation to heterogeneous reward pots.</text>
