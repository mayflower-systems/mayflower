[workspace]
resolver = "3"
members = [
    "fixed-number/*",
    "sol-log-sink/*",
    "reward-clearing/rust/*",
    "reward-clearing/sol-programs/*/prog",
    "reward-clearing/sol-programs/*/cpi",
    "reward-clearing/sol-programs/*/litesvm",
    "referral/rust/*",
    "avm/rust/*",
    "avm/sol-programs/*/prog",
    "avm/sol-programs/*/cpi",
    "sol-tools/rust/*",
    "weighted-emitter/rust/*",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mayflower-systems/mayflower"

[workspace.dependencies]
# Workspace crates. Paths are relative to this file.
# Each entry needs a version to be published: crates.io has no paths, so
# `cargo package` drops the path and keeps only the version. The version is a
# caret range; the local build fails if the crate's own version leaves it.
# Release tooling (release-plz) rewrites these versions on each release.
mayf-fixed-number = { path = "fixed-number/mayf-fixed-number", version = "0.1.0" }
mayf-fixed-dashu = { path = "fixed-number/mayf-fixed-dashu", version = "0.1.0" }
mayf-fixed-drivers = { path = "fixed-number/mayf-fixed-drivers", version = "0.1.0" }
mayf-micro-basis-points = { path = "fixed-number/mayf-micro-basis-points", version = "0.1.0" }
mayf-sol-log-sink-id = { path = "sol-log-sink/mayf-sol-log-sink-id", version = "1.0.0" }
mayf-sol-log-sink-cpi = { path = "sol-log-sink/mayf-sol-log-sink-cpi", version = "1.0.0" }
mayf-referral = { path = "referral/rust/mayf-referral", version = "0.1.0" }
mayf-weighted-emitter = { path = "weighted-emitter/rust/mayf-weighted-emitter", version = "0.1.0" }
mayf-characteristic = { path = "avm/rust/mayf-characteristic", version = "0.1.0" }
mayf-characteristic-linear = { path = "avm/rust/mayf-characteristic-linear", version = "0.1.0" }
mayf-characteristic-linear-driver = { path = "avm/rust/mayf-characteristic-linear-driver", version = "0.1.0" }
mayf-avm-calculator = { path = "avm/rust/mayf-avm-calculator", version = "0.1.0" }
mayf-avm-engine-linear-sol = { path = "avm/sol-programs/linear-engine/prog", version = "0.1.0" }
mayf-avm-engine-linear-sol-cpi = { path = "avm/sol-programs/linear-engine/cpi", version = "0.1.0" }
mayf-spl-token = { path = "sol-tools/rust/mayf-spl-token", version = "0.1.0" }
mayf-reward-clearing = { path = "reward-clearing/rust/mayf-reward-clearing", version = "0.1.0" }
mayf-reward-clearing-sol = { path = "reward-clearing/sol-programs/reward-clearing/prog", version = "0.1.0" }
mayf-reward-clearing-sol-cpi = { path = "reward-clearing/sol-programs/reward-clearing/cpi", version = "0.1.0" }

# Third-party crates.
# Declare every third-party crate here, once, with an exact `=` pin by default.
# Public SDK types may use a documented compatible range so library consumers
# can unify their SDK versions; Cargo.lock still pins this workspace's build.
# Member crates reference these with `workspace = true` and never set a version.
# Members may add features; they may not change the version.
# Cargo.lock pins the transitive graph by version and checksum; build with `--locked`.
# To upgrade a crate, change its pin here, then run `cargo update -p <crate>`.
anchor-lang = "=1.1.2"
# Must match the anchor-lang-idl version that anchor-lang =1.1.2 uses, so IDL
# extraction matches the programs it describes.
anchor-lang-idl = "=0.1.4"
anchor-spl = "=1.1.2"
anyhow = "=1.0.104"
borsh = "=1.8.1"
clap = "=4.6.7"
crypto-bigint = { version = "=0.5.5", default-features = false }
dashu = { version = "=0.4.4", default-features = false }
fixed = { version = "=1.28.0", default-features = false }
# LiteSVM 0.18 matches the workspace serialization crates and supports Solana address 2.7.
litesvm = "=0.18.2"
serde_json = "=1.0.154"
solana-account = "=4.7.0"
solana-account-view = { version = "=2.1.0", default-features = false }
# Public in generated clients and log-sink helpers. Accept compatible 2.x SDKs;
# LiteSVM currently selects 2.7.x, while independent clients can select 2.9.x.
solana-address = { version = "2.7.0", default-features = false }
solana-clock = "=3.2.1"
solana-instruction = "=3.5.1"
solana-instruction-error = "=2.5.0"
solana-keypair = "=3.1.2"
# The fixed-size CPI helper borrows data; the allocating `slice-cpi` API is disabled.
solana-instruction-view = { version = "=2.1.0", default-features = false, features = ["cpi"] }
solana-message = "=4.6.0"
solana-program-error = "=3.0.1"
solana-program-pack = "=3.1.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"
solana-transaction-error = "=3.4.0"
spl-token-interface = "=3.0.0"
