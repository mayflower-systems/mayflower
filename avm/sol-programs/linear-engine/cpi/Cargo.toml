[package]
name = "mayf-avm-engine-linear-sol-cpi"
version = "0.1.0"
description = "Mayflower AVM engine linear Solana program CPI crate"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mayf_avm_engine_linear_sol_cpi"
# Cargo can load the workspace before the first generation creates this file.
path = "src/lib.rs"
doctest = false

[dependencies]
borsh = { workspace = true, features = ["derive"] }
solana-address = { workspace = true, features = ["decode", "borsh"] }
solana-instruction.workspace = true
